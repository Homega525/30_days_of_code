<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card Bravo</title>
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
    <style>

        body{
            padding: 0;
            margin: 0;
        }

        #container {
            display: inline-flex;
             background-color: #f1effa;
            width: 100%;
            min-height: 100vh;
            justify-content: center;
            /* flex-direction: column; */
            align-items: center; 
            margin: 0;
        }

        #right_text {
            width: 40%;
        }
      

        h1 {
            color: #5a3fed;
            font-size: 4.5rem;
            font-family: ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji",Segoe UI Symbol,"Noto Color Emoji";
            font-weight: 700;
            margin-bottom: 0;
            margin-top: 0;
        }

        p {
            color: #65758b;
            font-size: 24px;
            font-family: ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji",Segoe UI Symbol,"Noto Color Emoji";
            /* padding-left: 25%;
            padding-right: 25%; */
            text-align: left;
            margin-top: 5px;
            margin-bottom: 40px;
        }

        #first_button {
            background-color: #4936ec;
            color: #ffffff;
            font-size: .875rem;
            font-weight: bolder;
            font-family: ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji",Segoe UI Symbol,"Noto Color Emoji";
            border-radius: 10px;
            border: 0px;
            padding: 15px 30px;
            margin-right: 20px;
            text-decoration: none;
            box-shadow: #65758b;
        }

        #second_button{
            background-color: white;
            color: #0f1729;
            font-size: .875rem;
            font-weight: bolder;
            font-family: ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji",Segoe UI Symbol,"Noto Color Emoji";
            border-radius: 10px;
            border: 0px;
            padding: 15px 35px;
            text-decoration: none;

        }

        #first_button:hover {
            background-color: #5546dd;
            color: #ffffff;
        }
        #second_button:hover {
            background-color: #4936ec;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <section id="container">
        <div id="left_avatar">
            
<lord-icon
    src="https://cdn.lordicon.com/srupsmbe.json"
    trigger="hover"
    colors="primary:#65758b,secondary:#5a3fed"
    style="width:350px;height:350px">
</lord-icon>
        </div>
        <div id="right_text">
            <h1>Homin</h1>
        <p>Transforming ideas into exceptional digital experiences through innovative design and development</p>
        <div>
            <a href="#" id="first_button">Explore Services</a>
            <a href="" id="second_button">Get in Touch</a>
        </div>
        </div>
    </section>
</body>
</html>
